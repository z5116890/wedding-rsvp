overwrite: true
schema: src/app/graphql/**/*.graphql
generates:
  src/app/graphql/schema/index.ts:
    plugins:
      - typescript
      - typescript-resolvers
      - add:
          content:
            - '/* eslint-disable */'
    config:
      avoidOptionals:
        field: false
        inputValue: true
        object: true
        defaultValue: true
        resolvers: true
config:
  typesPrefix: 'Gql'
  noSchemaStitching: true
  namingConvention:
    enumValues: keep
  optionalInfoArgument: true
  makeResolverTypeCallable: true
  scalars:
    ID: number
    LocalDate: LocalDate
